# Engine settings for MVP v0.1.
# role_fields maps a role named in templates/rules to the Project Master field holding that person's email.
# Roles with no field yet (Regulatory head, Costing owner, Costing, PM) fall back as listed;
# role_routing roles use their own field when set, else fall back. Fallbacks are flagged in the item
# so nobody mistakes them for the real role holder.
version: 1
role_fields:
  BD POC: bd_poc_email
  R&D POC: rd_lead_email
  Founder: founder_approver_email
  Founders: founder_approver_email
  CSIO: csio_approver_email
  R&D lead: rd_lead_email
role_fallbacks:
  PM: bd_poc_email
  Costing owner: bd_poc_email
  Regulatory head: founder_approver_email
  Costing: bd_poc_email                 # (fallback) G2 placeholder, no Projects field yet
# Named charter roles (V2-03): role -> Projects-app field -> fallback field.
# The fallback is used only when the field is missing or empty, and is flagged "(fallback)".
# These fields are read from the fixture's project block for routing ONLY and are never sent to
# Clappia (they don't exist in the Projects app yet). multi: the field is a comma-separated list;
# its first address is used.
role_routing:
  Sponsor:            {field: sponsor_email,         fallback: founder_approver_email}
  Project Lead:       {field: project_lead_email,    fallback: bd_poc_email}
  Chemist:            {field: rd_chemists,           fallback: rd_lead_email, multi: true}
  Analytical lead:    {field: analytical_lead_email, fallback: rd_lead_email}
  Procurement:        {field: procurement_email,     fallback: bd_poc_email}
  Process engineer:   {field: process_lead_email,    fallback: rd_lead_email}
  Pilot coordination: {field: pilot_lead_email,      fallback: founder_approver_email}
# Receiving POC per gate: acknowledges Notes and e-signs ownership.
receiving_poc_field:
  G1: rd_lead_email
# Open decision #3: founder sign-off at G1 as Standard tick (spec default) or Critical approval.
g1_11_class: Standard
# Core templates (data/*_core.yaml) that inject and status use. Others are loaded and validated only.
# G2 is added in V2-11; until then existing projects get no G2 core records.
active_core_gates: [G1]
# Pilot guard (V2-03). When enforced, inject (live and --dry-run) and status refuse to run, before
# any API call, if an email they would write is not listed here: Projects record fields, every
# Gate Item's owner_email / approver_email, and the Decision record's receiving_poc_email.
pilot_allowlist: [aqeedat.kaur.sandhu@covvalent.com, sales.crams@covvalent.com, devendar.vanga@covvalent.com]
enforce_pilot_allowlist: true
# Projects-app fields (V2-04). Validated on load: no field in both lists, no role_routing field in either.
# people_fields: what people type in the Projects app. inject sends them only when it CREATES the record;
#   once the record exists it sends none of them, so nothing people typed is ever overwritten.
# system_fields: written only by status (and never by inject).
people_fields: [project_code, product, cas_number, specification, volume, timeline, target_price_usd_kg,
                end_use, target_market, destination, incoterms, transit_temperature,
                bd_poc_email, rd_lead_email, founder_approver_email, csio_approver_email]
system_fields: [traffic_light, open_critical, open_standard, unacked_notes, last_engine_run, current_stage]
# Clappia Select/Dropdown fields per app. The API wants these as a list of strings on write
# ("G1" -> ["G1"]) and returns them as lists on read. Everything else (e.g. target_market) is plain text.
select_fields:
  project_master: [end_use, incoterms, transit_temperature, current_stage, traffic_light]
  gate_items: [gate, source, item_class, hard_stop, ticked, decision, note_category, ack_decision, superseded]
  gate_decision: [gate, gate_ready, gate_decision, ownership_accepted]
